name: Bootstrap public compatibility module
on:
  push:
    paths:
      - ".github/workflows/import-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and extract standalone source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part0{0,1,2,3,4}.b64 | base64 --decode > "$RUNNER_TEMP/winclab_core.tar.xz"
          echo "f65cefa8027d177fa0f6fd65df8b87c87a963c50a13d9976682499e19e07ee6e  $RUNNER_TEMP/winclab_core.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/source"
          tar -xJf "$RUNNER_TEMP/winclab_core.tar.xz" -C "$RUNNER_TEMP/source"
          test -f "$RUNNER_TEMP/source/src/file_api.cpp"
          test -f "$RUNNER_TEMP/source/include/winclab/file_api.h"
          test -f "$RUNNER_TEMP/source/LICENSE"
          cp -a "$RUNNER_TEMP/source/." .
          rm -rf bootstrap
          rm -f .github/workflows/import-source.yml
      - name: Commit imported source on main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: import standalone Win32 file compatibility and PE scanner with tests"
          git push origin HEAD:main
