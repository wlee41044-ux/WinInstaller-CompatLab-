name: Public compatibility module tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-and-pe-tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC host regressions
            compiler: g++
            sanitizers: 'OFF'
            python: true
          - name: Clang ASan UBSan regressions
            compiler: clang++
            sanitizers: 'ON'
            python: false
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated public modules
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DWINCLAB_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build file and registry cores and host tests
        run: cmake --build build --parallel 2
      - name: File, registry, four synthetic profiles and isolation regressions
        run: ctest --test-dir build --output-on-failure
      - name: Build and verify offline source-kit module
        if: matrix.python
        run: |
          python3 tools/module_bundle.py build --out dist/WinInstaller-CompatLab-0.3.0.wicmod
          python3 tools/module_bundle.py verify dist/WinInstaller-CompatLab-0.3.0.wicmod
      - name: PE32 and PE32+ static comparison and manifest contracts
        if: matrix.python
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Publish reviewed source-kit for future private host integration
        if: matrix.python && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: WinInstaller-CompatLab-v0.3-source-kit
          path: dist/WinInstaller-CompatLab-0.3.0.wicmod
          if-no-files-found: error
          retention-days: 7
